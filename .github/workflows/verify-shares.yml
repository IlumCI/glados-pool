name: verify-shares

# Recompute every share the pool credited, with code the operator did not run.
#
# `design/pool.md` in the kernel repository calls the share log "the only thing
# standing in for trust": Layer 1 holds nobody's coins, so there is no wallet to
# audit and no treasury to inspect. But the ledger a pool publishes is a *tally* --
# work, accepted, stale, bad per worker -- and a tally cannot be re-verified.
# Reading it means trusting that the operator's own program counted honestly,
# which is the thing publishing was supposed to replace.
#
# `shares.txt` in this repository is the other half: one line per accepted share,
# carrying the assembled 80-byte header, the nonce and the target. This job takes
# it and recomputes every hash, using the *kernel's own* yespower, sha256d,
# blake2s and neoscrypt.
#
# ### Why this repository is not the pool's source
#
# It checks out `IlumCI/GLaDOS` and builds `pool/` from there rather than holding
# a copy, and that is deliberate. `pool/src/lib.rs` reaches into the kernel by
# `#[path]` -- twelve files, including yespower -- and says why: "Not copies: the
# same bytes the ring-0 miner compiles. A change to yespower that breaks agreement
# is a build failure or a failing vector here, in the same commit, rather than a
# share the pool rejects a week later for a reason nobody can find."
#
# A second copy of yespower in this repository would be exactly the drift that
# arrangement exists to prevent. So the source stays in one place and only the
# running and the published record live here -- which is also what keeps this
# repository small enough for a miner to read.
#
# ### What this is not
#
# **It is not the pool and cannot be.** A GitHub runner has no inbound
# networking: it dials out, nothing dials in. Stratum is a long-lived socket a
# miner opens *to* the pool, so there is no port here to serve it on. Share
# acceptance is inline anyway -- a miner needs a verdict in milliseconds.
#
# So this is the audit, not the service, and that is the more useful half to run
# somewhere public: accepting a share is cheap and the operator does it regardless,
# while independent re-verification is the one thing an operator structurally
# cannot do for themselves.

on:
  push:
    paths:
      - 'shares.txt'
      - '.github/workflows/verify-shares.yml'
  # Anybody can ask for a re-check. No secrets are used anywhere in this job, so
  # leaving it open costs nothing.
  workflow_dispatch:
    inputs:
      url:
        description: "Verify a log at this URL instead of the committed shares.txt"
        required: false
      records:
        description: "Or paste records directly, one per line"
        required: false
  # The door an outside thing comes in through: a pool that has just published a
  # log can ask for it to be checked without anybody watching.
  repository_dispatch:
    types: [verify-shares]
  schedule:
    # Daily, because an audit nobody runs is the same as no audit.
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: verify-shares
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: The published record
        uses: actions/checkout@v4

      # `path:` matters: `pool/` reaches the kernel by relative `#[path]`, so the
      # checkout has to keep `pool/` and `src/` as siblings. Checking out to the
      # root would work too; naming it is what makes the layout obvious to
      # somebody reading the log rather than the workflow.
      - name: The kernel, which is where the pool's source lives
        uses: actions/checkout@v4
        with:
          repository: IlumCI/GLaDOS
          path: glados

      - name: Install the pinned toolchain
        working-directory: glados
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version --verbose

      # `--target` explicitly. `pool/.cargo/config.toml` has to name *some*
      # target to escape the kernel's inherited UEFI one, and the one it names is
      # whatever host last typed `cargo test`. This job must not care which.
      - name: Build the verifier
        working-directory: glados/pool
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      # Before the verifier is trusted with a log, the claims about the record
      # format itself: that the algorithm spec round-trips including yespower's N
      # and r, which `Algo::name()` drops, and that one bit of a nonce changes the
      # digest. Plus the roster claims and a real socket exchange.
      - name: The verifier checks itself first
        working-directory: glados/pool
        run: ./target/x86_64-unknown-linux-gnu/release/glados-pool --selftest

      - name: Collect the log
        id: collect
        env:
          URL: ${{ github.event.inputs.url || github.event.client_payload.url }}
          RECORDS: ${{ github.event.inputs.records }}
        run: |
          set -u
          if [ -n "${RECORDS:-}" ]; then
            printf '%s\n' "$RECORDS" > batch.txt
            echo "source=pasted records" >> "$GITHUB_OUTPUT"
          elif [ -n "${URL:-}" ]; then
            # `-f`, so a 404 fails here rather than leaving an HTML error page to
            # be parsed as records -- which would come back as "unreadable" and
            # read like a corrupt log rather than a missing one.
            curl -fsS "$URL" -o batch.txt
            echo "source=$URL" >> "$GITHUB_OUTPUT"
          elif [ -f shares.txt ]; then
            cp shares.txt batch.txt
            echo "source=shares.txt in this repository" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no shares.txt committed yet and nothing passed; nothing to verify"
            echo "source=" >> "$GITHUB_OUTPUT"
          fi
          if [ -f batch.txt ]; then
            echo "  $(wc -l < batch.txt) line(s) from ${RECORDS:+pasted}${URL:+$URL}"
          fi

      - name: Recompute every share
        if: steps.collect.outputs.source != ''
        run: |
          ./glados/pool/target/x86_64-unknown-linux-gnu/release/glados-pool \
              --verify batch.txt | tee verdict.txt
          # The exit code is the verdict. Non-zero means a share was credited
          # that does not meet the target the operator published, which is the
          # one thing worth a red X on this repository.

      - name: Keep the verdict
        if: always() && steps.collect.outputs.source != ''
        uses: actions/upload-artifact@v4
        with:
          name: verdict
          path: |
            verdict.txt
            batch.txt
          if-no-files-found: ignore
